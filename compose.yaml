services:
  mongo:
    image: mongo:9.0.4
    # Published on 127.0.0.1 only, so `npm run dev` and tests on the host
    # can reach it but other machines on the network can't.
    # Set MONGO_PORT if 27017 is already in use on this machine.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    # Published on every interface (not just 127.0.0.1), so a phone on the
    # same Wi-Fi can open the app.
    ports:
      - "3000:3000"
    environment:
      # Inside Compose, MongoDB is reached by its service name. MONGO_DB lets
      # the e2e tests run against an empty database of their own.
      MONGO_URL: mongodb://mongo:27017/${MONGO_DB:-waitlist}
      RESTAURANT_TIME_ZONE: ${RESTAURANT_TIME_ZONE:-Asia/Tokyo}
    depends_on:
      mongo:
        # Wait until MongoDB answers a ping, not just until it starts.
        condition: service_healthy

# Named volume: the waitlist survives `docker compose down`.
# `docker compose down -v` deletes it.
volumes:
  mongo-data:
